{% extends 'base.html' %}
{%load crispy_forms_tags static %}

{% block title %}
    Registration Form
{% endblock %}

{% block content %}
    <form method="POST">
        {% csrf_token %}
        {{ form |crispy}}

        <button type="submit" class="btn btn-success">Register</button>

    </form>
    <div>
        <p>Have an account<a href="{% url 'login' %}">Login</a></p>
    </div>
{% endblock %}
